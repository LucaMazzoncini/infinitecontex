<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Infinite Context logo</title>
  <desc id="desc">A layered infinity mark connected to memory nodes beside the Infinite Context wordmark.</desc>
  <defs>
    <linearGradient id="markGradient" x1="112" y1="70" x2="342" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="386" y1="106" x2="818" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.65" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="50" y="48" width="310" height="224" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="960" height="320" rx="44" fill="#F8FAFC"/>
  <path d="M0 232C92 206 159 232 238 266C356 317 495 308 620 256C737 207 814 198 960 229V320H0V232Z" fill="#E0F2FE"/>
  <path d="M0 254C92 232 168 260 256 288C378 326 496 302 630 264C744 232 836 226 960 260V320H0V254Z" fill="#DCFCE7"/>

  <g filter="url(#softShadow)">
    <path d="M126 160C126 114 161 84 205 84C236 84 263 101 288 130L302 147C325 175 345 196 374 196C399 196 418 180 418 160C418 140 399 124 374 124C347 124 326 144 302 173L288 190C263 219 236 236 205 236C161 236 126 206 126 160ZM166 160C166 183 183 199 207 199C227 199 244 188 265 164L275 152L265 140C244 116 227 105 207 105C183 105 166 137 166 160ZM315 168L325 180C346 204 354 215 374 215C398 215 434 194 434 160C434 126 398 105 374 105C354 105 346 116 325 140L315 152L305 140L322 120C347 91 359 84 374 84C421 84 474 114 474 160C474 206 421 236 374 236C359 236 347 229 322 200L305 180L315 168Z" fill="url(#markGradient)"/>
    <circle cx="206" cy="105" r="10" fill="#F8FAFC"/>
    <circle cx="374" cy="215" r="10" fill="#F8FAFC"/>
    <circle cx="288" cy="160" r="8" fill="#F8FAFC"/>
  </g>

  <text x="386" y="145" fill="url(#textGradient)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="0">Infinite Context</text>
  <text x="389" y="191" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="520" letter-spacing="0">Local-first memory for AI coding workflows</text>
  <g>
    <rect x="388" y="216" width="136" height="34" rx="17" fill="#ECFDF5"/>
    <text x="412" y="239" fill="#047857" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Snapshot</text>
    <rect x="538" y="216" width="124" height="34" rx="17" fill="#EFF6FF"/>
    <text x="563" y="239" fill="#1D4ED8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Restore</text>
    <rect x="676" y="216" width="148" height="34" rx="17" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="704" y="239" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Handoff</text>
